<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6a0dad">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Forgot Password - SSUET AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="auth-container" style="max-width:480px;">
        <div class="ssuet-branding">
            <div class="auth-logo">🔒</div>
        </div>
        <h1 class="auth-title">Recover Your Account</h1>
        <p class="auth-subtitle">Enter your email to receive a verification code and reset your password.</p>

        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>

        <div id="step1">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" id="email" placeholder="student@ssuet.edu.pk" required>
            </div>
            <button class="btn-primary" id="sendOtpBtn" onclick="sendOtp()">Send Verification Code</button>
            <div id="timer" class="countdown-text"></div>
        </div>

        <div id="step2" style="display:none; margin-top:16px;">
            <div class="form-group">
                <label class="form-label">Enter 6-digit Code</label>
                <input type="text" class="form-input" id="otpCode" maxlength="6" placeholder="000000">
            </div>
            <button class="btn-primary" id="verifyBtn" onclick="verifyOtp()">Verify Code</button>
        </div>

        <div id="step3" style="display:none; margin-top:16px;">
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" class="form-input" id="newPassword" placeholder="Minimum 6 characters">
            </div>
            <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input type="password" class="form-input" id="confirmPassword" placeholder="Confirm new password">
            </div>
            <button class="btn-primary" id="resetBtn" onclick="resetPassword()">Reset Password</button>
        </div>

        <div class="auth-footer" style="margin-top:18px;">
            Remembered? <a href="/login">Back to Login</a>
        </div>
    </div>

<script>
let countdownInterval;
let resendDisabled = false;

function getCsrfToken() {
    return document.querySelector('meta[name="csrf-token"]').getAttribute('content');
}

function startTimer(seconds){
    clearInterval(countdownInterval);
    const timerDisplay = document.getElementById('timer');
    const sendOtpBtn = document.getElementById('sendOtpBtn');
    let timeLeft = seconds;
    resendDisabled = true;
    sendOtpBtn.disabled = true;
    sendOtpBtn.textContent = 'Sending...';
    timerDisplay.textContent = `Resend available in ${timeLeft}s`;

    countdownInterval = setInterval(()=>{
        timeLeft--;
        if(timeLeft<=0){
            clearInterval(countdownInterval);
            timerDisplay.textContent = '';
            resendDisabled = false;
            sendOtpBtn.disabled = false;
            sendOtpBtn.textContent = 'Resend Code';
        } else {
            timerDisplay.textContent = `Resend available in ${timeLeft}s`;
        }
    },1000);
}

async function sendOtp(){
    const email = document.getElementById('email').value.trim().toLowerCase();
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    errorMsg.style.display='none'; successMsg.style.display='none';
    if(!email || !email.includes('@')){ alert('Enter a valid email'); return; }
    document.getElementById('sendOtpBtn').disabled = true;
    document.getElementById('sendOtpBtn').textContent = 'Sending...';
    try{
        const res = await fetch('/api/forgot/send-otp', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-Token': getCsrfToken()
            },
            body: JSON.stringify({ email })
        });
        const data = await res.json();
        if(res.ok && data.success){
            successMsg.textContent = data.message;
            successMsg.style.display = 'block';
            document.getElementById('step2').style.display = 'block';
            startTimer(60);
        } else {
            errorMsg.textContent = data.error || 'Failed to send code';
            errorMsg.style.display = 'block';
            document.getElementById('sendOtpBtn').disabled = false;
            document.getElementById('sendOtpBtn').textContent = 'Send Verification Code';
        }
    }catch(err){
        errorMsg.textContent = 'Connection error. Try again.';
        errorMsg.style.display = 'block';
        document.getElementById('sendOtpBtn').disabled = false;
        document.getElementById('sendOtpBtn').textContent = 'Send Verification Code';
    }
}

async function verifyOtp(){
    const email = document.getElementById('email').value.trim().toLowerCase();
    const otp = document.getElementById('otpCode').value.trim();
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    errorMsg.style.display='none'; successMsg.style.display='none';
    if(!otp || otp.length!==6){ alert('Enter 6-digit code'); return; }
    const btn = document.getElementById('verifyBtn');
    btn.disabled = true; btn.textContent = 'Verifying...';
    try{
        const res = await fetch('/api/forgot/verify-otp', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-Token': getCsrfToken()
            },
            body: JSON.stringify({ email, otp_code: otp })
        });
        const data = await res.json();
        if(res.ok && data.success){
            successMsg.textContent = data.message;
            successMsg.style.display = 'block';
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step3').style.display = 'block';
        } else {
            errorMsg.textContent = data.error || 'Invalid code';
            errorMsg.style.display = 'block';
            btn.disabled = false; btn.textContent = 'Verify Code';
        }
    }catch(err){
        errorMsg.textContent = 'Connection error. Try again.';
        errorMsg.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Verify Code';
    }
}

async function resetPassword(){
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    errorMsg.style.display='none'; successMsg.style.display='none';
    if(newPassword.length < 6){ alert('Password must be 6+ chars'); return; }
    if(newPassword !== confirmPassword){ alert('Passwords do not match'); return; }
    const btn = document.getElementById('resetBtn');
    btn.disabled = true; btn.textContent = 'Resetting...';
    try{
        const res = await fetch('/api/forgot/reset-password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-Token': getCsrfToken()
            },
            body: JSON.stringify({ new_password: newPassword })
        });
        const data = await res.json();
        if(res.ok && data.success){
            successMsg.textContent = data.message;
            successMsg.style.display = 'block';
            setTimeout(()=> window.location.href = '/login', 1400);
        } else {
            errorMsg.textContent = data.error || 'Failed to reset password';
            errorMsg.style.display = 'block';
            btn.disabled = false; btn.textContent = 'Reset Password';
        }
    }catch(err){
        errorMsg.textContent = 'Connection error. Try again.';
        errorMsg.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Reset Password';
    }
}
</script>
</body>
</html>
